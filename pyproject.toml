[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ahura"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["rich>=13.9,<16"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["ahura*"]
exclude = ["Docs*", "tests*"]
